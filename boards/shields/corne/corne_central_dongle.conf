CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# The dongle should talk to the computer over USB only.
# Split BLE remains enabled for the two peripheral halves, but this prevents
# the central from advertising as a host-pairable "Corne" Bluetooth keyboard.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y

