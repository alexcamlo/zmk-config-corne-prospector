CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# BLE must stay enabled on the central because ZMK split BLE depends on it.
CONFIG_ZMK_USB=y

# Diagnostic logging on the USB dongle only. Use the serial console to watch
# split BLE reconnects/battery events while comparing left/right drain.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_TIMESTAMP_64BIT=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
CONFIG_ZMK_LOG_LEVEL_DBG=y
#CONFIG_KSCAN_LOG_LEVEL_INF=y
